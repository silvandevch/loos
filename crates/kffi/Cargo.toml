[package]
name = "loos-kffi"
description = "no_std C ABI for the boot kernel (x86_64-unknown-none): executive, Ps, crash dumps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "loos_kffi"
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
loos-kernel = { path = "../loos-kernel" }
loos-ksync = { path = "../ksync" }
loos-kdump = { path = "../kdump" }
loos-shell = { path = "../loos-shell" }
loos-lin = { path = "../loos-lin" }
loos-prism = { path = "../loos-prism" }
loos-win32k = { path = "../loos-win32k" }
loos-drivers = { path = "../loos-drivers" }
loos-net = { path = "../loos-net" }
loos-compositor = { path = "../loos-compositor" }
loos-winrt = { path = "../loos-winrt" }
loos-security = { path = "../loos-security" }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true
