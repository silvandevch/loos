[workspace]
resolver = "2"
members = ["ksync", "kmem", "khal", "loos-kernel", "loos-registry", "loos-drivers", "loos-security", "loos-btrfs", "loos-btrfs-ops", "loos-fs", "loos-vfs", "kdump", "tasksched", "vt", "dpkg", "winget", "timesvc", "msix", "pkgstate", "msi", "kms", "ffi", "kffi", "loos-shell", "loos-net", "loos-compositor", "loos-win32k", "loos-lin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[profile.release]
panic = "abort"
lto = true

# RSA/bignum math in tests and tools is unusably slow at opt-level 0.
[profile.dev.package.loos-security]
opt-level = 3
