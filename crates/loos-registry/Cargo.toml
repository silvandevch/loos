[package]
name = "loos-registry"
description = "LoOS registry hive reader/writer and key/value store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Persist hives through the LoOS VFS (btrfs `\\System\\config`).
vfs = ["dep:loos-vfs", "dep:loos-fs"]

[dependencies]
loos-vfs = { path = "../loos-vfs", optional = true }
loos-fs = { path = "../loos-fs", optional = true }

[dev-dependencies]
loos-vfs = { path = "../loos-vfs" }
loos-fs = { path = "../loos-fs", features = ["std"] }

[lints]
workspace = true
