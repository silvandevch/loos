[package]
name = "loos-switch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "LoOS Switch — the safe, local-only LoOS installer and migration manager"
license = "MIT"
publish = false

[[bin]]
name = "loos-switch"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
walkdir = "2"
thiserror = "2"
hex = "0.4"
libc = "0.2"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
